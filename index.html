<title>Freed Spike 交流區 · 保養資訊、DIY 教學 &amp; 推薦地點</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
  :root{
    --red:#d5182f; --red-dark:#a5101f; --ink:#181a1f; --ink-soft:#5b6270;
    --line:#e7e9ee; --bg:#f4f5f7; --card:#ffffff; --chip:#eef0f4;
    --radius:16px; --shadow:0 1px 3px rgba(20,22,30,.06),0 8px 24px rgba(20,22,30,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang HK","Noto Sans HK","Microsoft JhengHei",system-ui,sans-serif;
    color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}

  /* Header */
  /* 車會 banner 圖本身已經有「FREED SPIKE 交流區」字樣，所以直接當 heading 用。
     用原比例出，唔 crop，構圖（兩架車 + 青馬大橋夜景）保持完整。
     h1 用 .sr-only 保留落 DOM，screen reader 同 SEO 照讀到，圖片當裝飾 alt=""。 */
  header{background:#0e1015;color:#fff}
  .head-inner{max-width:1120px;margin:0 auto}
  /* 手機：滿版闊度（高度自然係闊度 ÷ 1.84）。
     闊螢幕：改為鎖高度，闊度跟住比例縮，唔會食咗整個第一屏。 */
  .hero{display:block;width:100%;max-width:960px;margin:0 auto;height:auto}
  @media(min-width:560px){
    .hero{width:auto;max-width:100%;height:240px}
  }
  .tagline{font-size:12.5px;color:#aeb4c0;text-align:center;padding:10px 20px 12px;
    background:linear-gradient(180deg,#12141a,#181b22)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  /* Tabs */
  nav.tabs{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);
    backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line)}
  .tabs-inner{max-width:1120px;margin:0 auto;display:flex;gap:4px;padding:0 16px;
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs-inner::-webkit-scrollbar{display:none}
  .tab{padding:15px 16px;font-weight:700;font-size:15px;color:var(--ink-soft);
    border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;flex:0 0 auto}
  .tab.active{color:var(--red);border-color:var(--red)}

  main{max-width:1120px;margin:0 auto;padding:20px 16px 60px}

  /* Controls */
  .controls{display:flex;flex-direction:column;gap:14px;margin-bottom:18px}
  .search{position:relative}
  .search input{width:100%;padding:13px 16px 13px 44px;border:1px solid var(--line);
    border-radius:12px;font-size:15px;background:var(--card);outline:none}
  .search input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(213,24,47,.12)}
  .search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.4}

  .seg{display:inline-flex;background:var(--chip);border-radius:12px;padding:4px;gap:4px;align-self:flex-start}
  .seg button{border:0;background:transparent;padding:9px 16px;border-radius:9px;font-weight:700;
    font-size:14px;color:var(--ink-soft);cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
  .seg small{display:block;font-weight:500;font-size:11px;color:var(--ink-soft);margin-top:1px}
  .seg button.on small{color:var(--red)}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--card);padding:8px 13px;border-radius:999px;
    font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;display:flex;gap:6px;align-items:center}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip .n{font-size:11px;opacity:.7}

  .count{font-size:13px;color:var(--ink-soft);margin:2px 2px 14px}

  /* Grid + cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;
    display:flex;flex-direction:column;border:1px solid var(--line)}
  .thumb{aspect-ratio:4/3;background:#eef0f4 center/cover no-repeat;position:relative;cursor:pointer}
  .thumb.empty{display:grid;place-items:center;color:#c2c7d0;font-size:34px}
  .badge{position:absolute;top:10px;left:10px;background:rgba(24,26,31,.82);color:#fff;
    font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:999px;backdrop-filter:blur(4px)}
  .card-body{padding:14px 15px 16px;display:flex;flex-direction:column;gap:9px;flex:1}
  .card-body h3{font-size:16.5px;font-weight:800}
  .row{font-size:13px;display:flex;gap:7px;align-items:flex-start}
  .row .k{color:var(--ink-soft);flex:0 0 auto;font-weight:600}
  .row .v{color:var(--ink)}
  .tag-club{align-self:flex-start;background:#fff3f4;color:var(--red-dark);border:1px solid #f6d5d9;
    font-size:12px;font-weight:700;padding:4px 9px;border-radius:8px}
  .interval{align-self:flex-start;background:#eefaf1;color:#1c7a44;font-size:12px;font-weight:700;
    padding:4px 9px;border-radius:8px}
  /* DIY 教學卡片：接線步驟 / 工具材料 */
  .diy-block{background:#f8f9fb;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .diy-block .h{font-size:12.5px;font-weight:800;color:var(--ink);margin-bottom:6px;
    display:flex;align-items:center;gap:6px}
  .diy-block ol,.diy-block ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
  .diy-block li{font-size:13px;color:var(--ink);line-height:1.45}
  .diy-block ul{list-style:disc}
  .card-foot{margin-top:auto;padding-top:4px}
  .btn-video{display:inline-flex;align-items:center;gap:7px;background:var(--red);color:#fff;
    font-weight:700;font-size:13.5px;padding:9px 14px;border-radius:10px;width:100%;justify-content:center}
  .btn-video:active{background:var(--red-dark)}
  .btn-ghost{display:inline-flex;align-items:center;gap:6px;background:var(--chip);color:var(--ink-soft);
    font-weight:600;font-size:13px;padding:9px 12px;border-radius:10px;justify-content:center;width:100%}

  /* Location cards */
  .loc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .loc .thumb{aspect-ratio:16/10}
  .maps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .maps a{font-size:12.5px;font-weight:700;padding:9px 4px;border-radius:10px;text-align:center;border:1px solid var(--line)}
  .m-g{background:#eaf1fe;color:#1a56db;border-color:#d3e0fb}
  .m-a{background:#eafaf0;color:#128a4d;border-color:#cfeeda}
  .m-w{background:#eef0ff;color:#4b48d6;border-color:#dcdcfb}
  .phone{display:inline-flex;align-items:center;gap:7px;font-weight:800;color:var(--red-dark);font-size:15px}

  .empty-state{text-align:center;color:var(--ink-soft);padding:60px 20px;font-size:15px}

  /* Maintenance reference */
  .maint-note{background:#fffbea;border:1px solid #f5e6b8;color:#6f5300;font-size:13px;
    padding:12px 14px;border-radius:12px;margin-bottom:16px;line-height:1.6}
  .maint-block{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
  .maint-block h3{font-size:15.5px;font-weight:800;padding:14px 16px;background:#fafbfc;
    border-bottom:1px solid var(--line)}
  .maint-block .blk-note{font-size:12.5px;color:var(--ink-soft);padding:10px 16px;border-bottom:1px solid var(--line)}
  table.maint{width:100%;border-collapse:collapse;font-size:13.5px}
  table.maint th{text-align:left;font-weight:700;color:var(--ink-soft);font-size:12.5px;
    padding:11px 16px;border-bottom:1px solid var(--line)}
  table.maint td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
  table.maint tr:last-child td{border-bottom:0}
  table.maint td.part{font-weight:800;white-space:nowrap}
  .maint-list{padding:6px 16px 14px}
  .maint-list li{font-size:13.5px;margin:8px 0 0 18px;line-height:1.6}
  .dash{color:#c2c7d0}
  .maint-fig{border-top:1px solid var(--line);padding:14px 16px 16px}
  .maint-fig img{width:100%;max-width:460px;display:block;margin:0 auto;border-radius:12px;
    border:1px solid var(--line);cursor:zoom-in;background:#eef0f4}
  .maint-fig figcaption{font-size:12.5px;color:var(--ink-soft);text-align:center;
    margin-top:9px;line-height:1.6}
  /* 表格格內示範影片 */
  .cell-media{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0;flex:1}
  .cell-vid{width:auto;max-width:100%;max-height:320px;display:block;border-radius:10px;
    border:1px solid var(--line);background:#0d0f13}
  .cell-vid-cap{font-size:12px;color:var(--ink-soft);line-height:1.5}

  @media(max-width:640px){
    table.maint thead{display:none}
    table.maint tr{display:block;border-bottom:1px solid var(--line);padding:9px 0}
    table.maint tr:last-child{border-bottom:0}
    table.maint td{display:flex;gap:10px;border:0;padding:5px 16px}
    table.maint td::before{content:attr(data-label);flex:0 0 84px;color:var(--ink-soft);
      font-weight:600;font-size:12.5px}
    table.maint td.part{white-space:normal}
  }

  /* Lightbox */
  .lb{position:fixed;inset:0;background:rgba(10,11,15,.9);display:none;place-items:center;z-index:100;padding:24px}
  .lb.on{display:grid}
  .lb img{max-width:100%;max-height:90vh;border-radius:12px}
  .lb .x{position:absolute;top:18px;right:22px;color:#fff;font-size:34px;cursor:pointer;line-height:1}

  footer{max-width:1120px;margin:0 auto;padding:24px 16px 50px;color:var(--ink-soft);font-size:12.5px;text-align:center}

  @media(max-width:520px){
    .seg{width:100%}.seg button{flex:1}
    .maps{grid-template-columns:repeat(3,1fr)}
    .tabs-inner{padding:0 12px}
    .tab{padding:15px 11px;font-size:14.5px}
  }
</style>
</head>
<body>
<header>
  <div class="head-inner">
    <img class="hero" src="assets/brand/hero.jpg" alt="" width="960" height="521">

<main>

  <section id="view-maint">
    <div class="controls">
      <div class="seg" id="maintSeg"></div>
    </div>
    <div class="maint-note">
      ⚠️ 以下資料由車友整理，<strong>僅供參考</strong>。實際更換周期會因駕駛習慣、路況同車輛狀況而有所不同，
      最終請以原廠保養手冊或技師建議為準。
    </div>
    <div id="maintBody"></div>
  </section>

  <!-- DIY VIEW -->
  <section id="view-diy" style="display:none">

      <div class="seg" id="modelSeg"></div>
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="搜尋零件、型號、牌子…（例：頭燈、NGK、風隔）">

      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="ql" type="search" placeholder="搜尋車房 / 地點 / 地址…">
      </div>
      <div class="chips" id="locChips"></div>
    </div>
    <div class="count" id="locCount"></div>
    <div class="loc-grid" id="locGrid"></div>

</main>

<footer>

<script>
const D = window.SITE_DATA;
const catMap = Object.fromEntries(D.categories.map(c=>[c.id,c]));
const state = {model:D.models[0].id, cat:'all', q:'', ql:'', locCat:'all', maintModel:D.models[0].id};

/* ---------- 保養參考資訊（靜態內容，直接在此編輯） ----------
   每個型號係一個 block 陣列。block 支援兩種：
     {title:'標題', note:'可選說明', type:'table', pillLast:true,
      cols:['欄1','欄2'], rows:[['值1','值2'], ...]}     // 空值用 '' 會顯示 —
     {title:'標題', type:'list', items:['第一點','第二點']}
   要新增內容，照住格式加 block 就得；改完 push 上 GitHub 即生效。
------------------------------------------------------------ */

      caption:'示範影片：方向盤鎖死（輕搖方向盤同時輕力扭匙）'}],

      video:'assets/videos/warning-beep.mp4',
      caption:'示範影片：鎖車前嘅異常提示聲'},
     {text:'抆走會放電嘅裝置，再嘗試扭匙',
      video:'assets/videos/device-drain-fix.mp4',
      caption:'示範影片：抆走放電裝置後嘅處理'}],
    ['匙齒磨蝕',

    ['鎖芯磨損／彈子彈簧疲勞',

     '吹走／挑走異物，用專用鎖芯潤滑劑。唔好亂噴黏性油，會黏住灰塵越搞越差'],
    ['匙身彎曲變形',
     '同備用匙並排對比就見到',
     '換匙。唔好自己拗返直，容易斷'],
    ['排檔未完全入 P',
     '呢個係扭唔返 LOCK／拔唔出匙，唔係扭唔入',
     '將排檔推實入 P'],
    ['防盜認唔到匙',
     '匙扭得到但引擎唔啟動，儀錶板綠色匙仔燈閃',
     '唔係鎖芯問題，要去車房讀碼／重新配對'],
    ['Smart key fob 冇電',
     'Push start 版本按掣冇反應（GB5/GB7 視乎版本有 smart key，亦有普通鎖匙版）',
     '換 fob 電池。應急啟動方法各版本唔同，請查車主手冊或問車房'],
  ],
};

const MAINT = {
  gb3_gp3: [
    {
      title: '定期保養參考周期',
      type: 'table',
      pillLast: true,
      cols: ['項目', '規格', '車會推薦', '建議更換周期'],
      rows: [
        ['偈油', '0W20 / 5W30', 'Millers XF Premium C5 C6 0W20 / Millers EE Performance ECO 5W30', '5,000 - 10,000km / 6-12 months'],

    KEY_TROUBLE,
  ],
  gb5_gb7: [
    {
      title: '定期保養參考周期',
      type: 'table',
      pillLast: true,
      cols: ['項目', '規格', '車會推薦', '建議更換周期'],
      rows: [
        ['偈油', '0W20 / 5W30', 'Millers XF Premium C5 C6 0W20 / Millers EE Performance ECO 5W30', '5,000 - 10,000km / 6-12 months'],

        ['風隔', '', 'Blitz', '30,000km'],
        ['洗天風 / 蝴蝶掩', '', '', '30,000 - 50,000km'],
        ['波箱油', 'GB5：HFC-2 / GB7：ATF-DW1 Ultra', '', '40,000 - 80,000km / 2-4 years'],

      ],
    },
    {
      title: '極力子油（GB7 Hybrid 專用）',
      note: 'GB7 Hybrid 用 i-DCD 7 速雙離合器波箱，設有獨立極力子油壺。GB5 汽油版冇此項目。',
      type: 'table',
      cols: ['項目', '內容'],
      rows: [
        ['規格', 'DOT 4 煞車油 — 切勿誤用波箱油'],
        ['推薦', '原廠 Honda Brake & Clutch Fluid DOT 4；或 Ate SL / Motul / Brembo DOT 4'],
        ['用量', '沖洗油壺連放氣約 0.5 - 1 公升'],
        ['更換周期', '每 2 年 或 30,000 - 40,000km'],
        ['唔換後果', '極力子油易吸水，長期唔換會令極力子泵生鏽、漏油，最終波箱報錯、跳波甚至鎖死，維修費非常昂貴'],
      ],
      image: {
        src: 'assets/maint/gb7_clutch_fluid_before_after.jpeg',
        alt: 'GB7 極力子油壺換油前後對比',
        caption: '上半部：換之前嘅舊油（深褐色）　·　下半部：換之後嘅新油（清透）',
      },
    },
    KEY_TROUBLE,
  ],
};

/* ---------- helpers ---------- */
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc = s => (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function ytId(u){const m=(u||'').match(/(?:youtu\.be\/|v=)([\w-]{6,})/);return m?m[1]:null;}

/* ---------- lightbox ---------- */
const lb=document.getElementById('lb'), lbImg=lb.querySelector('img');
function openLb(src){lbImg.src=src;lb.classList.add('on');}
lb.addEventListener('click',()=>lb.classList.remove('on'));

/* ---------- model switch ---------- */
const modelSeg=document.getElementById('modelSeg');
D.models.forEach(m=>{
  const b=el('button',m.id===state.model?'on':'',`${m.name}<small>${m.years}</small>`);
  b.onclick=()=>{state.model=m.id;[...modelSeg.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');renderCats();renderDiy();};
  modelSeg.appendChild(b);
});

/* ---------- category chips ---------- */
function currentItems(){return D.models.find(m=>m.id===state.model).items;}
function renderCats(){
  const items=currentItems();
  const counts={};items.forEach(i=>counts[i.category]=(counts[i.category]||0)+1);
  const chips=document.getElementById('catChips');chips.innerHTML='';
  const all=el('div','chip'+(state.cat==='all'?' on':''),`全部 <span class="n">${items.length}</span>`);
  all.onclick=()=>{state.cat='all';renderCats();renderDiy();};chips.appendChild(all);
  D.categories.forEach(c=>{
    if(!counts[c.id])return;
    const ch=el('div','chip'+(state.cat===c.id?' on':''),`${c.icon} ${c.name} <span class="n">${counts[c.id]}</span>`);
    ch.onclick=()=>{state.cat=c.id;renderCats();renderDiy();};chips.appendChild(ch);
  });
}

/* ---------- DIY grid ---------- */
function renderDiy(){
  const grid=document.getElementById('diyGrid');grid.innerHTML='';
  const q=state.q.trim().toLowerCase();
  let items=currentItems().filter(i=>{
    if(state.cat!=='all'&&i.category!==state.cat)return false;
    if(q){const blob=(i.part+' '+i.spec+' '+i.club_spec+' '+i.interval+' '+(i.steps||[]).join(' ')+' '+(i.materials||[]).join(' ')).toLowerCase();if(!blob.includes(q))return false;}
    return true;
  });
  document.getElementById('diyCount').textContent=`共 ${items.length} 個項目`;
  if(!items.length){grid.appendChild(el('div','empty-state','搵唔到相符嘅項目 🔍'));return;}
  items.forEach(i=>{
    const cat=catMap[i.category]||{icon:'',name:''};
    const card=el('div','card');
    // thumb
    if(i.images&&i.images.length){
      const t=el('div','thumb');t.style.backgroundImage=`url("${i.images[0]}")`;
      t.appendChild(el('span','badge',`${cat.icon} ${cat.name}`));
      t.onclick=()=>openLb(i.images[0]);card.appendChild(t);
    }else{
      const t=el('div','thumb empty','🔧');t.appendChild(el('span','badge',`${cat.icon} ${cat.name}`));card.appendChild(t);
    }
    // body
    const body=el('div','card-body');
    body.appendChild(el('h3',null,esc(i.part)));
    if(i.club_spec)body.appendChild(el('div','tag-club','★ 車會推薦：'+esc(i.club_spec)));
    if(i.spec)body.appendChild(el('div','row',`<span class="k">型號</span><span class="v">${esc(i.spec)}</span>`));
    if(i.interval)body.appendChild(el('div','interval','🔄 '+esc(i.interval)));
    if(i.steps&&i.steps.length){
      const box=el('div','diy-block');
      box.appendChild(el('div','h','🔌 接線步驟'));
      const ol=el('ol');
      i.steps.forEach(s=>ol.appendChild(el('li',null,esc(s))));
      box.appendChild(ol);body.appendChild(box);
    }
    if(i.materials&&i.materials.length){
      const box=el('div','diy-block');
      box.appendChild(el('div','h','🧰 工具材料'));
      const ul=el('ul');
      i.materials.forEach(s=>ul.appendChild(el('li',null,esc(s))));
      box.appendChild(ul);body.appendChild(box);
    }
    const foot=el('div','card-foot');
    if(i.video){
      const a=el('a','btn-video','▶ 睇 YouTube 教學');a.href=i.video;a.target='_blank';a.rel='noopener';foot.appendChild(a);
    }else{
      foot.appendChild(el('div','btn-ghost','暫無影片教學'));
    }
    body.appendChild(foot);card.appendChild(body);grid.appendChild(card);
  });
}

/* ---------- Locations ---------- */
function renderLocCats(){
  const counts={};D.locations.forEach(l=>counts[l.category]=(counts[l.category]||0)+1);
  const chips=document.getElementById('locChips');chips.innerHTML='';
  const all=el('div','chip'+(state.locCat==='all'?' on':''),`全部 <span class="n">${D.locations.length}</span>`);
  all.onclick=()=>{state.locCat='all';renderLocCats();renderLoc();};chips.appendChild(all);
  (D.location_categories||[]).forEach(c=>{
    if(!counts[c.id])return;
    const ch=el('div','chip'+(state.locCat===c.id?' on':''),`${c.icon} ${c.name} <span class="n">${counts[c.id]}</span>`);
    ch.onclick=()=>{state.locCat=c.id;renderLocCats();renderLoc();};chips.appendChild(ch);
  });
}
function renderLoc(){
  const grid=document.getElementById('locGrid');grid.innerHTML='';
  const q=state.ql.trim().toLowerCase();
  let items=D.locations.filter(l=>{
    if(state.locCat!=='all'&&l.category!==state.locCat)return false;
    if(!q)return true;return (l.name+' '+l.address).toLowerCase().includes(q);
  });
  document.getElementById('locCount').textContent=`共 ${items.length} 個地點`;
  if(!items.length){grid.appendChild(el('div','empty-state','搵唔到相符嘅地點 🔍'));return;}
  items.forEach(l=>{
    const card=el('div','card loc');
    if(l.images&&l.images.length){
      const t=el('div','thumb');t.style.backgroundImage=`url("${l.images[0]}")`;t.onclick=()=>openLb(l.images[0]);card.appendChild(t);
    }
    const body=el('div','card-body');
    body.appendChild(el('h3',null,esc(l.name)));
    if(l.address)body.appendChild(el('div','row',`<span class="k">📍</span><span class="v">${esc(l.address)}</span>`));
    if(l.phone){const p=el('div');p.innerHTML=`<a class="phone" href="tel:${esc(l.phone)}">📞 ${esc(l.phone)}</a>`;body.appendChild(p);}
    const maps=el('div','maps');
    if(l.gmap)maps.appendChild(mapLink(l.gmap,'m-g','Google'));
    if(l.amap)maps.appendChild(mapLink(l.amap,'m-a','高德'));
    if(l.waze)maps.appendChild(mapLink(l.waze,'m-w','Waze'));
    if(maps.children.length)body.appendChild(maps);
    if(l.videos&&l.videos.length){
      const a=el('a','btn-video','🎬 睇路線示範片');a.href=l.videos[0];a.target='_blank';a.rel='noopener';
      body.appendChild(a);
    }
    card.appendChild(body);grid.appendChild(card);
  });
}
function mapLink(href,cls,label){const a=el('a',cls,label);a.href=href;a.target='_blank';a.rel='noopener';return a;}

/* ---------- 保養參考資訊 ---------- */
const maintSeg=document.getElementById('maintSeg');
D.models.forEach(m=>{
  const b=el('button',m.id===state.maintModel?'on':'',`${m.name}<small>${m.years}</small>`);
  b.onclick=()=>{state.maintModel=m.id;[...maintSeg.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');renderMaint();};
  maintSeg.appendChild(b);
});

function renderMaint(){
  const wrap=document.getElementById('maintBody');wrap.innerHTML='';
  const blocks=MAINT[state.maintModel]||[];
  if(!blocks.length){wrap.appendChild(el('div','empty-state','呢個型號暫時未有保養資料 🛠️'));return;}
  blocks.forEach(b=>{
    const box=el('div','maint-block');
    box.appendChild(el('h3',null,esc(b.title)));
    if(b.note)box.appendChild(el('div','blk-note',esc(b.note)));
    if(b.type==='list'){
      const ul=el('ul','maint-list');
      (b.items||[]).forEach(i=>ul.appendChild(el('li',null,esc(i))));
      box.appendChild(ul);
    }else{
      const table=el('table','maint');
      const thead=el('thead'),htr=el('tr');
      b.cols.forEach(c=>{const th=el('th',null,esc(c));th.setAttribute('scope','col');htr.appendChild(th);});
      thead.appendChild(htr);table.appendChild(thead);
      const tbody=el('tbody');
      (b.rows||[]).forEach(r=>{
        const tr=el('tr');
        b.cols.forEach((col,i)=>{
          const td=el('td',i===0?'part':null);
          td.setAttribute('data-label',col);
          const cell=r[i];
          if(cell==null||cell===''){td.innerHTML='<span class="dash">—</span>';}
          else if(typeof cell==='object'){
            /* 格內可以帶示範影片：{text:'文字', video:'路徑', caption:'說明'} */
            const box=el('div','cell-media');
            if(cell.text)box.appendChild(el('div',null,esc(cell.text)));
            if(cell.video){
              const v=document.createElement('video');
              v.className='cell-vid';v.src=cell.video;
              v.controls=true;v.playsInline=true;v.muted=false;
              v.preload='metadata';v.setAttribute('controlsList','nodownload');
              // 影片載入唔到就唔顯示，避免出現破圖
              v.onerror=()=>{v.remove();const c=box.querySelector('.cell-vid-cap');if(c)c.remove();};
              box.appendChild(v);
              if(cell.caption)box.appendChild(el('div','cell-vid-cap',esc(cell.caption)));
            }
            td.appendChild(box);
          }
          else if(b.pillLast&&i===b.cols.length-1){td.innerHTML=`<span class="interval">${esc(cell)}</span>`;}
          else{td.textContent=cell;}
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);box.appendChild(table);
    }
    if(b.image&&b.image.src){
      const fig=el('figure','maint-fig');
      const img=document.createElement('img');
      img.src=b.image.src;
      img.alt=b.image.alt||b.image.caption||b.title;
      img.loading='lazy';
      img.onclick=()=>openLb(b.image.src);
      // 相片未上傳時整段隱藏，避免出現破圖
      img.onerror=()=>fig.remove();
      fig.appendChild(img);
      if(b.image.caption)fig.appendChild(el('figcaption',null,esc(b.image.caption)));
      box.appendChild(fig);
    }
    wrap.appendChild(box);
  });
}

/* ---------- tabs ---------- */
const VIEWS=['maint','diy','loc'];
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');
    const v=t.dataset.view;
    VIEWS.forEach(name=>{
      const sec=document.getElementById('view-'+name);
      if(sec)sec.style.display=(name===v)?'':'none';
    });
  };
});
document.getElementById('q').addEventListener('input',e=>{state.q=e.target.value;renderDiy();});
document.getElementById('ql').addEventListener('input',e=>{state.ql=e.target.value;renderLoc();});

/* ---------- init ---------- */
renderCats();renderDiy();renderLocCats();renderLoc();renderMaint();
</script>

<script src="esm/preview.js"></script>
</body>
